name: Build Mettle

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'supabase/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      METTLE_VERSION_CODE: ${{ github.run_number }}
      METTLE_MAPS_API_KEY: ${{ secrets.METTLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.METTLE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::METTLE_KEYSTORE_B64 secret is not set - building an unsigned test version only (no release)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mettle-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*Test'

      - name: Build signed release
        if: steps.key.outputs.signed == 'true'
        env:
          METTLE_KEYSTORE_PATH: ${{ runner.temp }}/mettle-release.jks
          METTLE_KEYSTORE_PASSWORD: ${{ secrets.METTLE_KEYSTORE_PASSWORD }}
          METTLE_KEY_ALIAS: mettle
          METTLE_KEY_PASSWORD: ${{ secrets.METTLE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "mettle-0.1.${METTLE_VERSION_CODE}.apk"

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${METTLE_VERSION_CODE}"
          gh release create "$TAG" "mettle-0.1.${METTLE_VERSION_CODE}.apk" \
            --title "Mettle 0.1.${METTLE_VERSION_CODE}" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Install the APK on your phone; future versions update over it." \
            --latest

      - name: Build test version (no signing key yet)
        if: steps.key.outputs.signed != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test version
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mettle-test-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
